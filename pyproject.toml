[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paradox-simulator"
version = "0.1.0"
description = "Rules engine and balance simulator for the board game Paradox: The Last Timeline"
authors = [{ name = "Rafael Reis Garcia" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://reisaurafael.github.io/paradoxo-simulator/"
Repository = "https://github.com/reisaurafael/paradoxo-simulator"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ipykernel",
    "jupyterlab",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*", "simulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
